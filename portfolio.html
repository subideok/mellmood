<x-dc>

<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FFFFFF;color:#111111;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:clip}
*{box-sizing:border-box}
a{color:#111111}
a:hover{color:#111111}
input,textarea,button{font-family:inherit}
::selection{background:#111111;color:#FFFFFF}
@keyframes mmChar{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes mmBlink{50%{opacity:0}}
@keyframes mmLine{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@media (max-width:759px){
main#top{padding:104px 20px 88px!important}
main#top h1{padding-bottom:20px!important}
[data-m=pfgrid]{grid-template-columns:1fr!important;gap:12px!important;margin-top:24px!important}
[data-m=pfgrid]>button{aspect-ratio:4/3!important}
[data-m=pmodal]{padding:0!important;align-items:stretch!important}
[data-m=pmodal]>div{padding:20px 16px 28px!important;max-height:none!important;height:100%}
[data-m=pmodal]>div>div:first-child{margin-bottom:16px!important}
[data-m=pmodal] h3{font-size:22px!important}
[data-m=pmodal] [role=img]{height:auto!important;aspect-ratio:4/3;background-color:#F3F3F3!important}
[data-m=pmodal] sc-if>div,[data-m=pmodal] [role=img]+div{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important;margin-top:8px!important}
footer>div{padding:56px 20px 32px!important}
[data-m=fgrid]{grid-template-columns:1fr!important;gap:32px!important}
footer>div>div:last-child{margin-top:44px!important}

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">

    <div style="display:flex;justify-content:flex-end"><button onClick="{{ toggleMenu }}" aria-label="닫기" style="width:44px;height:44px;border:0;background:transparent;font-size:24px;cursor:pointer;color:#111111">×</button></div>

<main id="top" data-screen-label="Portfolio" style="padding:152px 44px 140px;min-height:100vh">
  <div style="max-width:1240px;margin:0 auto">
    <h1 data-reveal="0" style="margin:0;padding-bottom:36px;border-bottom:1px solid #D7D7D7;font-size:20px;font-weight:600;letter-spacing:-0.02em;color:#111111">포트폴리오</h1>
    <div data-m="pfgrid" style="margin-top:48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 24px">
      <sc-for list="{{ pfItems }}" as="p" hint-placeholder-count="6">
        <button onClick="{{ p.open }}" aria-label="{{ p.name }} 사진 보기" style="position:relative;display:block;width:100%;aspect-ratio:16/10;padding:0;border:0;overflow:hidden;cursor:pointer;background:#DFDFDF url({{ p.img }}) center/cover no-repeat">
          <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);color:#FFFFFF;font-size:22px;font-weight:600;letter-spacing:-0.02em;text-align:center;opacity:0;transition:opacity .4s ease" style-hover="opacity:1">{{ p.name }}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{ pfMulti }}" hint-placeholder-val="{{ false }}">
      <nav aria-label="페이지" style="margin-top:72px;display:flex;justify-content:center;align-items:center;gap:6px">
        <sc-for list="{{ pfPages }}" as="g" hint-placeholder-count="1">
          <button onClick="{{ g.go }}" aria-current="{{ g.cur }}" style="width:32px;height:32px;border-radius:50%;border:0;background:{{ g.bg }};color:{{ g.fg }};font-family:inherit;font-size:13px;cursor:pointer">{{ g.n }}</button>
        </sc-for>
      </nav>
    </sc-if>
  </div>
</main>

<sc-if value="{{ projectOpen }}" hint-placeholder-val="{{ false }}">

        <sc-for list="{{ proj.shots }}" as="s" hint-placeholder-count="6">
          <button onClick="{{ s.pick }}" aria-label="사진 {{ s.n }}" style="aspect-ratio:1;border-radius:0;border:0;padding:0;cursor:pointer;background:#DFDFDF;opacity:{{ s.op }};transition:opacity .25s;overflow:hidden"><span style="display:block;width:100%;height:100%;background:url({{ s.src }}) center/cover no-repeat"></span></button>
        </sc-for>
      </div></sc-if>
    </div>
  </div>
</sc-if>
